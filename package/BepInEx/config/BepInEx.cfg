## Cold Waters MP: BepInEx settings that Cold Waters needs.
## BepInEx's default entrypoint (Application) does not start in Cold Waters; this one does.
## Any setting not listed here keeps BepInEx's default.

[Preloader.Entrypoint]

## The local filename of the assembly to target.
Assembly = UnityEngine.dll

## The name of the type in the entrypoint assembly to search for the entrypoint method.
Type = MonoBehaviour

## The name of the method in the specified entrypoint assembly and type to hook and load Chainloader from.
Method = .cctor

[Logging.Disk]

## Write BepInEx\LogOutput.log (send this file with a bug report).
Enabled = true
